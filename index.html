<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Choice | AI Voice Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --chloe-primary: #10b981;
        --chloe-secondary: #06b6d4;
        --sam-primary: #ef4444;
        --sam-secondary: #f97316;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        overflow-x: hidden;
        transition: background-color 1s ease;
      }
      .mesh-gradient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        filter: blur(100px);
        opacity: 0.5;
        transition: all 1s ease;
      }
      .mesh-blob {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(80px);
        animation: float 20s infinite alternate ease-in-out;
      }
      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(10vw, 20vh) scale(1.1); }
        66% { transform: translate(-5vw, 15vh) scale(0.9); }
        100% { transform: translate(5vw, -10vh) scale(1); }
      }
      .glass-container {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }
      .agent-glow-chloe {
        box-shadow: 0 0 80px -10px rgba(16, 185, 129, 0.4);
        border-color: rgba(16, 185, 129, 0.3);
      }
      .agent-glow-sam {
        box-shadow: 0 0 80px -10px rgba(239, 68, 68, 0.4);
        border-color: rgba(239, 68, 68, 0.3);
      }
      .audio-bar {
        transition: height 0.1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
      }
      .shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
    </style>
  <script type="importmap">

}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
